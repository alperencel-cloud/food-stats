<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Product Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Food Product Checker</h1>
    <p>Think twice before putting in your mouth!</p>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="e.g. nutella, fazer, oatly" required>
      <button type="submit">Search</button>
    </form>
  </header>

  <p id="status"></p>
  <div id="results"></div>

  <script src="script.js"></script>
</body>
</html>
